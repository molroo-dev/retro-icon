<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Trash can body -->
  <rect x="3" y="5" width="10" height="9" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
  <rect x="4" y="6" width="8" height="7" fill="#FFFFFF"/>
  
  <!-- Trash can lid -->
  <rect x="2" y="4" width="12" height="1" fill="#808080" stroke="#000000" stroke-width="1"/>
  
  <!-- Handle -->
  <path d="M 6 4 L 6 2 L 10 2 L 10 4" stroke="#000000" stroke-width="1" fill="none"/>
  
  <!-- Vertical lines on trash can -->
  <line x1="6" y1="7" x2="6" y2="12" stroke="#808080" stroke-width="1"/>
  <line x1="8" y1="7" x2="8" y2="12" stroke="#808080" stroke-width="1"/>
  <line x1="10" y1="7" x2="10" y2="12" stroke="#808080" stroke-width="1"/>
</svg>

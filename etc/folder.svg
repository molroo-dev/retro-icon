<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Windows 95 style folder icon -->
  <!-- Folder tab -->
  <path d="M 2 7 L 2 5 L 13 5 L 15 7 Z" fill="#FFFF00" stroke="#666666" stroke-width="1"/>
  <!-- Main folder body -->
  <rect x="2" y="7" width="28" height="20" fill="#FFFF00" stroke="#666666" stroke-width="1"/>
  <!-- 3D highlight on top -->
  <line x1="3" y1="8" x2="29" y2="8" stroke="#FFFF99" stroke-width="1"/>
  <!-- 3D shadow on right -->
  <line x1="29" y1="9" x2="29" y2="26" stroke="#CCCC00" stroke-width="1"/>
  <!-- 3D shadow on bottom -->
  <line x1="3" y1="26" x2="29" y2="26" stroke="#CCCC00" stroke-width="1"/>
  <!-- Inner highlight -->
  <line x1="3" y1="8" x2="3" y2="25" stroke="#FFFF99" stroke-width="1"/>
</svg>

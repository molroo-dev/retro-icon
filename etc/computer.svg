<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Windows 95 style computer icon -->
  <!-- Monitor -->
  <rect x="4" y="4" width="24" height="18" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
  <!-- Screen -->
  <rect x="6" y="6" width="20" height="14" fill="#008080" stroke="#000000" stroke-width="1"/>
  <!-- Screen highlight -->
  <rect x="7" y="7" width="18" height="12" fill="#00A0A0"/>
  <!-- Monitor stand -->
  <rect x="13" y="22" width="6" height="3" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
  <!-- Monitor base -->
  <rect x="8" y="25" width="16" height="3" fill="#808080" stroke="#000000" stroke-width="1"/>
  <!-- 3D highlights -->
  <line x1="5" y1="5" x2="27" y2="5" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="5" y1="5" x2="5" y2="21" stroke="#FFFFFF" stroke-width="1"/>
</svg>

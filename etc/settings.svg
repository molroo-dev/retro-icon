<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Windows 95 style settings/gear icon -->
  <!-- Outer gear -->
  <circle cx="16" cy="16" r="10" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
  <!-- Gear teeth -->
  <rect x="15" y="4" width="2" height="4" fill="#C0C0C0" stroke="#000000" stroke-width="0.5"/>
  <rect x="15" y="24" width="2" height="4" fill="#C0C0C0" stroke="#000000" stroke-width="0.5"/>
  <rect x="4" y="15" width="4" height="2" fill="#C0C0C0" stroke="#000000" stroke-width="0.5"/>
  <rect x="24" y="15" width="4" height="2" fill="#C0C0C0" stroke="#000000" stroke-width="0.5"/>
  <!-- Diagonal teeth -->
  <rect x="8" y="8" width="2" height="3" fill="#C0C0C0" stroke="#000000" stroke-width="0.5" transform="rotate(-45 9 9.5)"/>
  <rect x="22" y="8" width="2" height="3" fill="#C0C0C0" stroke="#000000" stroke-width="0.5" transform="rotate(45 23 9.5)"/>
  <rect x="8" y="21" width="2" height="3" fill="#C0C0C0" stroke="#000000" stroke-width="0.5" transform="rotate(45 9 22.5)"/>
  <rect x="22" y="21" width="2" height="3" fill="#C0C0C0" stroke="#000000" stroke-width="0.5" transform="rotate(-45 23 22.5)"/>
  <!-- Inner circle -->
  <circle cx="16" cy="16" r="5" fill="#808080" stroke="#000000" stroke-width="1"/>
  <!-- Center hole -->
  <circle cx="16" cy="16" r="2" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
</svg>
